<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa Cordillera: prototipo del mundo social autónomo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#E4E8EC; --panel:#F5F6F8; --ink:#1C2630; --muted:#56636F; --line:#C5CDD5; --soft:#E9EDF1;
  --accent:#4535C0; --accent-soft:#E3E0F8; --good:#23784F; --bad:#AE3630; --warn:#A8700A; --info:#2A679A;
  --font-ui:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-px:"Pixelify Sans","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12171D; --panel:#1A2129; --ink:#E3E8ED; --muted:#95A2AF; --line:#2C3641; --soft:#222B35;
    --accent:#9D93FF; --accent-soft:#2B2750; --good:#5CC592; --bad:#F07A73; --warn:#E6AE45; --info:#6DB1E8;
  }
}
:root[data-theme="dark"]{
  --paper:#12171D; --panel:#1A2129; --ink:#E3E8ED; --muted:#95A2AF; --line:#2C3641; --soft:#222B35;
  --accent:#9D93FF; --accent-soft:#2B2750; --good:#5CC592; --bad:#F07A73; --warn:#E6AE45; --info:#6DB1E8;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.45 var(--font-ui)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* Barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand h1{font:600 22px/1 var(--font-px);margin:0;letter-spacing:.5px}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.clock{display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:end}
.clock .time{grid-row:span 2;font:600 38px/0.9 var(--font-px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.clock .date{font-size:13px;color:var(--muted)}
.clock .day{font-size:13px;font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;line-height:1.1}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:96px}
:root[data-theme="dark"] .btn.primary{color:#15122E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#15122E}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.group-label{font-size:12px;color:var(--muted);margin-right:2px}
.seed{display:flex;align-items:center;gap:6px}
.seed input{width:92px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-variant-numeric:tabular-nums}
.stats{display:flex;gap:18px;margin:0 0 0 auto}
.stats div{display:flex;flex-direction:column}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font:600 20px/1.1 var(--font-px);font-variant-numeric:tabular-nums}

main{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
.stage{display:grid;grid-template-rows:minmax(0,1fr) 240px;min-height:0;border-right:1px solid var(--line)}
.mapwrap{position:relative;min-height:0;background:#5B8440;overflow:hidden}
#map{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:grab;touch-action:none}
#map.dragging{cursor:grabbing}
.mapctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.mapctl .btn{background:rgba(245,246,248,.94);color:#1C2630;border-color:rgba(0,0,0,.2)}
.mapctl .btn[aria-pressed="true"]{background:#E3E0F8;color:#4535C0;font-weight:700}
.tip{position:absolute;pointer-events:none;background:rgba(20,24,32,.92);color:#fff;font-size:13px;padding:5px 8px;border-radius:5px;max-width:240px;display:none;z-index:3}
.tip b{display:block}
.progress{position:absolute;inset:0;display:none;place-items:center;background:rgba(18,22,40,.55);color:#fff;z-index:4}
.progress.on{display:grid}
.progress .box{background:rgba(20,24,32,.9);padding:14px 18px;border-radius:8px;min-width:240px;text-align:center}
.progress .track{height:8px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:8px;overflow:hidden}
.progress .track i{display:block;height:100%;width:0;background:#9D93FF}
.progress .pct{font:600 22px var(--font-px)}

/* Registro de eventos */
.log{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;background:var(--panel);border-top:1px solid var(--line)}
.loghead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;border-bottom:1px solid var(--line)}
.loghead h2{font-size:15px;margin:0 6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.minor{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-left:auto}
#events{list-style:none;margin:0;padding:0;overflow:auto}
#events li{display:grid;grid-template-columns:92px 108px minmax(0,1fr);gap:10px;padding:6px 14px;border-bottom:1px solid var(--soft);font-size:14px}
#events time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.kind{font-size:12px;font-weight:700;align-self:start;padding:1px 7px;border-radius:4px;justify-self:start;border:1px solid currentColor}
.k-good{color:var(--good)} .k-bad{color:var(--bad)} .k-warn{color:var(--warn)} .k-info{color:var(--info)}
.why{display:block;color:var(--muted);font-size:13px}
.who{border:0;background:none;padding:0;font-weight:700;color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.empty{padding:14px;color:var(--muted)}

/* Inspector */
.inspector{background:var(--panel);overflow:auto;min-height:0}
.ins-pad{padding:14px 16px}
.inspector h2{font-size:19px;margin:0}
.inspector h3{font-size:14px;margin:16px 0 6px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.back{border:0;background:none;color:var(--accent);padding:0;margin-bottom:8px;font-weight:700}
.now{margin:10px 0 0;padding:8px 10px;background:var(--soft);border-radius:6px;font-size:14px}
.badge{display:inline-block;font-size:12px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);margin:10px 0 6px}
.people{list-style:none;margin:0;padding:0}
.people button{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--soft);background:none;padding:7px 2px}
.people button:hover{background:var(--soft)}
.people .nm{font-weight:700}
.people .age{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.people .doing{grid-column:2 / 4;color:var(--muted);font-size:13px}
.dot{width:10px;height:10px;border-radius:2px;grid-row:span 2}
.note{color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px -16px 0;padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 6px;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.bar{display:grid;grid-template-columns:128px minmax(0,1fr) 32px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.bar .track{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.hot{background:var(--bad)}
.bar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:400;color:var(--muted)}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{background:var(--soft);border-radius:4px;padding:1px 8px;font-size:13px}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px}
.list small{display:block;color:var(--muted);font-size:13px}
.rel-head{display:flex;justify-content:space-between;gap:8px}
.rel-type{color:var(--muted);font-size:13px}
.mini{display:grid;grid-template-columns:118px minmax(0,1fr) 34px;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:3px}
.mini .track{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.mini i.hot{background:var(--bad)}
.faded{opacity:.45}
.ok{color:var(--good);font-weight:700} .no{color:var(--bad);font-weight:700}
.report{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px 0 4px}
.report div{background:var(--soft);border-radius:6px;padding:6px 8px}
.report span{display:block;font-size:12px;color:var(--muted)}
.report b{font-variant-numeric:tabular-nums;font-size:14px}

@media (max-width:1020px){
  .app{height:auto}
  main{grid-template-columns:1fr}
  .stage{grid-template-rows:auto 280px;border-right:0}
  .mapwrap{height:62vw;min-height:280px;max-height:560px}
  .stats{margin:0}
  #events li{grid-template-columns:80px minmax(0,1fr)}
  #events li .kind{grid-column:2}
  #events li .txt{grid-column:1 / 3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Villa Cordillera</h1>
      <p>Prototipo de observación del mundo social autónomo</p>
    </div>
    <div class="clock" aria-live="off">
      <div class="time" id="clkTime">06:00</div>
      <div class="date" id="clkDate">martes 13 abr 2027</div>
      <div class="day" id="clkDay">Día 1 de simulación</div>
    </div>
    <div class="controls">
      <button class="btn primary" id="play" aria-label="Pausar la simulación">Pausar</button>
      <span class="group-label" id="lblSpeed">Velocidad</span>
      <div class="seg" role="group" aria-labelledby="lblSpeed" id="speeds">
        <button data-speed="1">1x</button><button data-speed="10">10x</button><button data-speed="100" aria-pressed="true">100x</button><button data-speed="1000">1000x</button>
      </div>
      <span class="group-label" id="lblAdv">Avanzar</span>
      <div class="seg" role="group" aria-labelledby="lblAdv">
        <button data-adv="1440">1 día</button><button data-adv="10080">1 semana</button><button data-adv="43200">1 mes</button><button data-adv="525600">1 año</button>
      </div>
    </div>
    <form class="seed" id="seedForm">
      <label for="seed" class="group-label">Semilla</label>
      <input id="seed" type="number" value="108" inputmode="numeric">
      <button class="btn" type="submit">Regenerar</button>
    </form>
    <dl class="stats">
      <div><dt>Personas</dt><dd id="stPop">0</dd></div>
      <div><dt>Con empleo</dt><dd id="stJob">0%</dd></div>
      <div><dt>Ánimo medio</dt><dd id="stMood">0</dd></div>
      <div><dt>Eventos hoy</dt><dd id="stEv">0</dd></div>
    </dl>
  </header>

  <main>
    <section class="stage" aria-label="Mapa y registro">
      <div class="mapwrap" id="mapwrap">
        <canvas id="map" aria-label="Mapa de Villa Cordillera. Haz clic en una persona o edificio para inspeccionarlo."></canvas>
        <div class="tip" id="tip"></div>
        <div class="mapctl">
          <button class="btn" id="zoomOut" aria-label="Alejar">−</button>
          <button class="btn" id="zoomIn" aria-label="Acercar">+</button>
          <button class="btn" id="follow" aria-pressed="false">Seguir</button>
          <button class="btn" id="center">Ver todo</button>
        </div>
        <div class="progress" id="progress" role="status"><div class="box"><div>Simulando sin observar</div><div class="pct" id="progPct">0%</div><div class="track"><i id="progBar"></i></div></div></div>
      </div>
      <section class="log" aria-label="Registro de eventos">
        <div class="loghead">
          <h2>Registro de eventos</h2>
          <div class="chips" id="chips">
            <button data-f="all" aria-pressed="true">Todos</button>
            <button data-f="trabajo">Trabajo</button>
            <button data-f="relaciones">Relaciones</button>
            <button data-f="economia">Economía</button>
            <button data-f="salud">Salud</button>
            <button data-f="info">Información</button>
          </div>
          <label class="minor"><input type="checkbox" id="showMinor"> Incluir menores</label>
        </div>
        <ul id="events"></ul>
      </section>
    </section>
    <aside class="inspector" id="inspector" aria-live="polite"></aside>
  </main>
</div>

<script>
'use strict';
/*ENGINE-START*/
// ============================================================
//  MOTOR DE SIMULACIÓN (sin DOM). Toda aleatoriedad pasa por W.R
//  para que la misma semilla reproduzca el mismo mundo.
// ============================================================
const TS=8, TW=64, TH=40, TICK=5, MPT=0.6;
const DAY0=Date.UTC(2027,3,13);
const ROAD_X=[5,17,29,41,53], ROAD_Y=[4,14,24,34];
const isRoad=(x,y)=>ROAD_X.some(r=>x===r||x===r+1)||ROAD_Y.some(r=>y===r||y===r+1);
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
function sm32(a){return function(){a|=0;a=a+0x9e3779b9|0;let t=a^a>>>16;t=Math.imul(t,0x21f0aaad);t=t^t>>>15;t=Math.imul(t,0x735a2d97);return((t=t^t>>>15)>>>0)/4294967296;};}
class RNG{
  constructor(s){this.f=sm32(s>>>0);}
  next(){return this.f();}
  range(a,b){return a+(b-a)*this.f();}
  int(a,b){return a+Math.floor(this.f()*(b-a+1));}
  pick(arr){return arr[Math.floor(this.f()*arr.length)];}
  chance(p){return this.f()<p;}
  normal(m=0,s=1){const u=1-this.f(),v=this.f();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
}
const TRAITS=['apertura','responsabilidad','extraversion','amabilidad','estabilidad','impulsividad','sensibilidad','aprobacion'];
const TRAIT_LABEL={apertura:'Apertura',responsabilidad:'Responsabilidad',extraversion:'Extraversión',amabilidad:'Amabilidad',estabilidad:'Estabilidad emocional',impulsividad:'Impulsividad',sensibilidad:'Sensibilidad social',aprobacion:'Búsqueda de aprobación'};
const VALUES=['familia','seguridad','libertad','éxito','dinero','prestigio','pertenencia','conocimiento','creatividad','autonomía','altruismo','salud'];
const MN=['Carlos','Andrés','Juan','Felipe','Santiago','Julián','Camilo','Diego','Mateo','Sebastián','Óscar','Hernando','Luis','Jorge','Iván','Tomás','Samuel','Emilio','Fabio','Ricardo','Nicolás','Esteban','Alirio','Mauricio'];
const FN=['Laura','María','Valentina','Camila','Daniela','Paola','Natalia','Luisa','Sofía','Carolina','Diana','Marta','Gloria','Isabela','Juliana','Adriana','Lucía','Sara','Ana','Rosa','Teresa','Yolanda','Mariana','Ximena'];
const SUR=['Rojas','Gómez','Martínez','Rodríguez','López','Castro','Herrera','Vargas','Moreno','Suárez','Ramírez','Ortiz','Díaz','Pardo','Cárdenas','Mejía','Salazar','Quintero','Rincón','Beltrán','Osorio','Parra','Nieto','Acosta'];
const BIRTH=['Villa Cordillera','Tunja','Ibagué','Medellín','Cali','Bucaramanga','un pueblo de Boyacá','Pasto','Neiva','Villavicencio'];
const GIFTS=['un reloj','una bufanda tejida','un libro de poemas','una taza pintada a mano','un anillo','una planta'];
const PRICE={'teléfono':650000,bicicleta:480000,libro:45000,ropa:90000,regalo:70000};
const ARTICLE={'teléfono':'un teléfono',bicicleta:'una bicicleta',libro:'un libro',ropa:'ropa nueva'};
const COST=[35000,55000,85000];
const BARRIOS=[{name:'La Esperanza',cls:1},{name:'Centro',cls:2},{name:'San Martín',cls:0}];
const COLS=[7,19,31,43], ROWS=[6,16,26];
const LAYOUT=[
  [['casa','casa'],['colegio','casa'],['casa','casa'],['casa','gimnasio']],
  [['cafe','restaurante'],'parque',['oficina','hospital'],['casa','tienda']],
  [['casa','casa'],['fabrica','casa'],['casa','casa'],['casa','casa']]
];
const PDEF={
  casa:{label:'Vivienda'},
  parque:{label:'Parque',name:'Parque Central',open:[330,1260],vd:'all'},
  oficina:{label:'Oficinas',name:'Oficinas Andina',slots:12,pay:160000,shift:[480,1020],wd:'lv',open:[420,1140],vd:'lv'},
  hospital:{label:'Hospital',name:'Hospital San Rafael',slots:6,pay:170000,shift:[420,1020],wd:'ls',open:[0,1440],vd:'all'},
  colegio:{label:'Colegio',name:'Colegio Los Alisos',slots:4,pay:120000,shift:[400,800],wd:'lv',open:[360,840],vd:'lv'},
  fabrica:{label:'Fábrica',name:'Textiles del Sur',slots:12,pay:95000,shift:[360,840],wd:'lv',open:[330,900],vd:'lv'},
  tienda:{label:'Tienda',name:'Tienda El Surtidor',slots:3,pay:70000,shift:[540,1140],wd:'ls',open:[540,1200],vd:'all'},
  cafe:{label:'Café',name:'Café Cordillera',slots:3,pay:65000,shift:[420,900],wd:'ls',open:[420,1260],vd:'all'},
  restaurante:{label:'Restaurante',name:'Restaurante La Mesa',slots:3,pay:70000,shift:[660,1200],wd:'ls',open:[660,1320],vd:'all'},
  gimnasio:{label:'Gimnasio',name:'Gimnasio Forja',slots:2,pay:80000,shift:[360,840],wd:'ls',open:[360,1260],vd:'all'}
};
const FACTOR={cafe:2.2,parque:1.6,restaurante:1.4,casa:1.3,colegio:1.2,gimnasio:1};

const dayOf=t=>Math.floor(t/1440), modOf=t=>((t%1440)+1440)%1440, dowOf=t=>(2+dayOf(t))%7;
const isDay=(code,dow)=>code==='all'||(code==='lv'&&dow>=1&&dow<=5)||(code==='ls'&&dow>=1&&dow<=6);
const DOWN=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dateOf=t=>new Date(DAY0+t*60000);
const pad=n=>String(n).padStart(2,'0');
const fmtClock=t=>{const m=modOf(t);return pad(Math.floor(m/60))+':'+pad(m%60);};
const fmtDate=t=>{const d=dateOf(t);return `${DOWN[d.getUTCDay()]} ${d.getUTCDate()} ${MES[d.getUTCMonth()]} ${d.getUTCFullYear()}`;};
const fmtStamp=t=>{const d=dateOf(t);return `${d.getUTCDate()} ${MES[d.getUTCMonth()]} ${d.getUTCFullYear()!==2027?d.getUTCFullYear()+' ':''}${fmtClock(t)}`;};
const dayOfYear=t=>{const d=dateOf(t);return Math.floor((d-Date.UTC(d.getUTCFullYear(),0,1))/86400000);};
const pct=v=>Math.round(v*100)+'%';
const money=n=>(n<0?'−':'')+'$ '+Math.abs(Math.round(n)).toLocaleString('es-CO');
const g=(a,m,f)=>a.sex==='F'?f:m;

const W={};
const AG=id=>W.byId[id];

function genWorld(seed){
  Object.assign(W,{seed,R:new RNG(seed),t:360,evN:0,events:[],agents:[],byId:{},places:[],byType:{},households:[],
    facts:[],objs:[],objN:0,counts:{},todayEvents:0,bulk:false,logDirty:true,pathCache:new Map()});
  buildPlaces(); genPopulation(); genJobs(); genRelations(); genObjects(); genFacts(); initAgents();
}

function buildPlaces(){
  let hn=0;
  const add=(type,rect,door,b)=>{
    const d=PDEF[type];
    const p={id:W.places.length,type,rect,door,barrio:b.name,cls:b.cls,label:d.label,
      name:type==='casa'?`Vivienda ${pad(++hn)}`:d.name,open:d.open,vd:d.vd};
    if(d.slots) Object.assign(p,{slots:d.slots,pay:d.pay,shift:d.shift,wd:d.wd,staff:[],bossId:null});

function genJobs(){

    let s=R.next()*w.reduce((x,y)=>x+y,0),k=0;while(s>w[k]){s-=w[k];k++;}

function genRelations(){

function rel(a,b){let r=a.rels[b.id];if(!r)r=a.rels[b.id]={type:'desconocido',c:0,tr:.3,cf:0,n:0,last:0,args:0,fam:false};return r;}

function mStrength(m){const age=(W.t-m.t)/1440;const tau=5+40*m.i+10*m.r;return m.i*Math.exp(-age/tau);}

function ev(type,actors,text,causes=[],minor=false){

const openAt=(p,mod,dow)=>p.type==='casa'||(isDay(p.vd,dow)&&mod>=p.open[0]&&mod<p.open[1]-30);

function path(a,b){
  const k=a.x+','+a.y+'>'+b.x+','+b.y;if(W.pathCache.has(k))return W.pathCache.get(k);

  const out=[];if(prev[goal]===-1){out.push([a.x,a.y],[b.x,b.y]);}else{let c=goal;while(c!==s){out.push([c%TW,(c/TW)|0]);c=prev[c];}out.push([a.x,a.y]);out.reverse();}

function go(a,type,placeId,until){

function decide(a){
  const R=W.R,t=W.t,mod=modOf(t),d=dayOf(t),dow=dowOf(t),p=a.pers,n=a.needs,prev=a.act.type;
  if(a.sickUntil>t)return go(a,'enfermo',a.homeId,Math.min(a.sickUntil,t+180));
  if(prev==='dormir')return go(a,'desayunar',a.homeId,t+R.int(25,35));
  if(inSleep(a,mod))return go(a,'dormir',a.homeId,sleepUntil(a));

  if(a.student&&isDay('lv',dow)&&!a.worked&&mod>=a.wakeW&&mod<720)return go(a,'estudiar',W.byType.colegio[0].id,d*1440+800);
  let cap=Infinity;
  if(a.job&&isDay(a.job.wd,dow)&&!a.worked&&mod<a.job.start-150)cap=d*1440+a.job.start-150;
  const toBed=((a.bed-mod)+1440)%1440;cap=Math.min(cap,t+toBed);

  const wk=isDay('lv',dow);
  const opts=[{type:'descansar',place:a.homeId,s:.3+.2*(1-n.energia),dur:[40,90]}];
  if(n.hambre>.35){

    opts.push({type:'comer',place:pl?pl.id:a.homeId,s:n.hambre*1.5,dur:[30,50]});
  }
  if(n.soledad>.25&&a.age>=12){
    const pls=[];if(openAt(cafe,mod,dow)&&a.money>20000)pls.push(cafe);if(openAt(park,mod,dow))pls.push(park);
    if(pls.length)opts.push({type:'socializar',place:R.pick(pls).id,s:n.soledad*(.6+p.extraversion)*(n.energia>.2?1:.3)*(wk?1:1.3),dur:[50,140]});
  }
  if(a.want&&openAt(shop,mod,dow)&&a.money>PRICE[a.want]+100000)opts.push({type:'comprar',place:shop.id,s:.35+p.impulsividad*.5,dur:[20,40]});
  if(!a.exercised&&openAt(gym,mod,dow)&&a.age>=15&&a.age<75&&n.energia>.35)opts.push({type:'ejercicio',place:gym.id,s:p.responsabilidad*.6*n.energia+(a.values.includes('salud')?.2:0),dur:[45,75]});
  if(a.age<12&&openAt(park,mod,dow))opts.push({type:'jugar',place:park.id,s:.45,dur:[40,90]});
  let best=null;for(const o of opts){o.s+=R.next()*.25;if(!best||o.s>best.s)best=o;}
  let until=Math.min(t+R.int(best.dur[0],best.dur[1]),cap);

  go(a,best.type,best.place,until);
}
function onStart(a){
  const pl=W.places[a.loc];

// ---------- interacción social ----------
const irrit=x=>clamp((1-x.needs.energia)*.45+x.st.estres*.6-x.pers.amabilidad*.35+x.pers.impulsividad*.2);
function firstMeet(r,a,b,pl){
  if(r.type!=='desconocido')return;
  r.type=(pl.slots&&a.job&&b.job&&a.job.org===pl.id&&b.job.org===pl.id)?'compañero':(pl.type==='colegio'&&a.student&&b.student)?'compañero de clase':(pl.type==='casa'&&a.homeId===b.homeId&&a.hh!==b.hh)?'vecino':'conocido';
}
function upgrade(r){if(r.fam||r.type==='pareja'||r.type==='ex pareja')return;if(r.c>=.45)r.type='amigo';else if(r.type==='amigo'&&r.c<.3)r.type='conocido';}
function interact(a,b,pl){
  const R=W.R,ra=rel(a,b),rb=rel(b,a);firstMeet(ra,a,b,pl);firstMeet(rb,b,a,pl);
  const where=pl.type==='casa'?(pl.id===a.homeId?'casa':pl.name):pl.name;
  const v=.3+.35*(a.pers.amabilidad+b.pers.amabilidad)/2+.25*((a.st.animo+b.st.animo)/2-.5)+.3*(ra.c+rb.c)/2-.3*(ra.cf+rb.cf)/2-.45*(irrit(a)+irrit(b))/2+R.normal(0,.12);
  ra.n++;rb.n++;ra.last=rb.last=W.t;
  if(v<0){
    const sev=clamp(-v*1.5+.2);
    for(const[x,y,rx]of[[a,b,ra],[b,a,rb]]){
      const amp=1.4-x.pers.estabilidad;rx.cf=clamp(rx.cf+sev*.25*amp);rx.tr=clamp(rx.tr-sev*.12);rx.c=clamp(rx.c-sev*.07);rx.args++;
      bump(x,sev*.12*amp,-sev*.1);const perceived=clamp(sev*amp+R.normal(0,.05));

    }
    if((sev>.4||((ra.fam||ra.type==='pareja')&&sev>.3))&&W.t-(ra.argEv||-1e9)>2*1440){
      ra.argEv=rb.argEv=W.t;

  for(const[x,y,rx]of[[a,b,ra],[b,a,rb]]){

    rx.c=clamp(rx.c+gain);rx.tr=clamp(rx.tr+.015);rx.cf=clamp(rx.cf*.97);
    x.needs.soledad=clamp(x.needs.soledad-.1*(.5+x.pers.extraversion));x.st.animo=clamp(x.st.animo+.015);
    if(rx.n===1&&!rx.fam)mem(x,`Conocí a ${y.name} en ${where}`,.3,.4,y.id);
    else for(const m of x.mems)if(m.w===y.id&&m.r<5)m.r+=.2;
    upgrade(rx);
  }
  if(!ra.fam&&ra.type==='amigo'&&rb.type==='amigo'&&!ra.friendEv){
    ra.friendEv=rb.friendEv=true;
    ev('AMISTAD',[a,b],`{0} y {1} se hicieron ${a.sex==='F'&&b.sex==='F'?'amigas':'amigos'}`,[`${ra.n} encuentros`,`cercanía ${pct(ra.c)} / ${pct(rb.c)}`]);
  }
  if(a.age>=20&&b.age>=20&&!ra.fam&&ra.type==='amigo'&&rb.type==='amigo'&&Math.abs(a.age-b.age)<=12&&ra.c>.55&&rb.c>.5
     &&!partnerOf(a)&&!partnerOf(b)&&(a.sex!==b.sex||R.chance(.15))&&R.chance(.08)){
    ra.type=rb.type='pareja';
    ev('RELATIONSHIP_STARTED',[a,b],'{0} y {1} empezaron una relación de pareja',[`${ra.n} encuentros`,`cercanía ${pct(ra.c)} / ${pct(rb.c)}`]);
    mem(a,`Empecé una relación con ${b.name}`,.85,.9,b.id);mem(b,`Empecé una relación con ${a.name}`,.85,.9,a.id);bump(a,-.05,.1);bump(b,-.05,.1);
  }

}
function share(a,b){
  const R=W.R,cand=[];
  for(const[fid]of a.beliefs){const f=W.facts[fid];if(f.subject!==b.id&&!b.beliefs.has(fid))cand.push(fid);}
  if(!cand.length)return;
  const f=W.facts[R.pick(cand)];
  let text=f.subject===a.id?a.selfStory[f.id]:a.beliefs.get(f.id).text,distorted=false;
  if(R.chance(.08+.18*(1-b.pers.responsabilidad)+.1*a.pers.impulsividad)){const alt=f.variants.filter(x=>x!==text);if(alt.length){text=R.pick(alt);distorted=true;}}
  const correct=text===f.truth;
  b.beliefs.set(f.id,{text,correct,from:a.id,t:W.t});
  mem(b,`${a.name} me contó: «${text}»`,.35,0,a.id);
  if(!correct&&!f.rumors.has(text)){
    f.rumors.add(text);

    const top=Object.entries(cs).sort((x,y)=>y[1]-x[1])[0];if(top)causes.push(`causa más frecuente: ${top[0]}`);
    if(boss)causes.push(`confianza del jefe: ${pct(rel(boss,a).tr)}`);}

  mem(a,`Me despidieron de ${o.name}`,.9,-.9,boss?boss.id:null);bump(a,.3,-.25);
}
function daily(){
  const R=W.R,t=W.t,doy=dayOfYear(t);W.todayEvents=0;
  for(const a of W.agents){
    if(a.age>=18)a.money-=COST[a.cls]+a.deps*15000;
    for(const k in a.rels){const r=a.rels[k];r.cf*=.985;}
    if(a.retired)a.money+=55000;
    if(a.money<0&&!a.inDebt&&a.age>=18){a.inDebt=true;ev('DEUDA',[a],'{0} quedó en números rojos',[a.job?'gastos mayores que ingresos':a.retired?'pensión insuficiente':'sin ingresos',`gasto diario ${money(COST[a.cls]+a.deps*15000)}`]);mem(a,'Me quedé sin dinero',.6,-.7,null);}
    if(a.money>200000)a.inDebt=false;
    a.worked=false;a.exercised=false;
    a.lateLog=a.lateLog.filter(l=>t-l.t<14*1440);
    if(a.bday===doy){a.age++;ev('CUMPLEAÑOS',[a],`{0} cumplió ${a.age} años`,[],true);bump(a,0,.08);if(a.age===65&&!a.retired&&!a.job)a.retired=true;}
    const hp=.002+.018*a.st.estres*(1-a.needs.energia)+(a.age>60?.004:0);
    if(a.sickUntil<t&&R.chance(hp)){
      a.sickUntil=t+R.int(1,3)*1440;const c=[];
      if(a.st.estres>.5)c.push(`estrés alto (${pct(a.st.estres)})`);if(a.needs.energia<.35)c.push(`energía baja (${pct(a.needs.energia)})`);if(a.age>60)c.push(`edad (${a.age})`);if(!c.length)c.push('contagio en la comunidad');
      ev('SALUD',[a],`{0} se enfermó`,c);mem(a,'Estuve enferm'+g(a,'o','a'),.45,-.5,null);
    }
    if(has(a,'teléfono')&&R.chance(.0025*(.4+a.pers.impulsividad))){
      const o=a.objs.find(x=>x.kind==='teléfono');a.objs.splice(a.objs.indexOf(o),1);o.owner=null;o.history.push(`${fmtStamp(t)}: perdido`);
      ev('OBJECT_LOST',[a],'{0} perdió su teléfono',[a.pers.impulsividad>.6?`impulsividad alta (${pct(a.pers.impulsividad)})`:'descuido']);
      bump(a,.1,-.06);mem(a,'Perdí mi teléfono',.5,-.6,null);

        let ref=null;for(const k in a.rels){const r=a.rels[k],b=AG(k);if((r.type==='amigo'||r.fam)&&b.job&&open.includes(W.places[b.job.org])&&rel(b,a).c>.4){ref=b;break;}}
        if(R.chance(.05*(.5+a.pers.responsabilidad)*(a.money<0?1.4:1)+(ref?.07:0)))hire(a,ref?W.places[ref.job.org]:R.pick(open),ref,false);
      }
    }
    for(const k in a.rels){const r=a.rels[k];if(r.type!=='pareja')continue;const b=AG(k);if(a.idx>b.idx)continue;const rb=rel(b,a);

        for(const[x,y]of[[a,b],[b,a]]){mem(x,`Terminé con ${y.name}`,.85,-.85,y.id);bump(x,.25,-.2);}}}

      if(!has(a,'teléfono')&&a.age>=14){a.want='teléfono';a.wantCause='necesita un teléfono';}

        else if(r<.55&&!has(a,'bicicleta')&&a.age<60){a.want='bicicleta';a.wantCause='quiere moverse en bicicleta';}

function updateNeeds(a,occ,hourly){
  const dt=TICK/60,n=a.needs,s=a.st,p=a.pers,ty=a.act.type,act=a.act.active&&!a.travel;
  const rest=act&&(ty==='dormir'||ty==='enfermo');
  if(rest){n.energia+=.125*dt*(1-.45*s.estres)*(ty==='enfermo'?.6:1);n.hambre+=.035*dt;}
  else{const work=act&&(ty==='trabajar'||ty==='estudiar');n.energia-=(work?.058:.045)*dt*(1+.4*s.estres);n.hambre+=(work?.09:.16)*dt;}
  const company=act&&!rest&&(occ.get(a.loc)||[]).length>1;
  n.soledad+=company?-.012*dt:rest?.004*dt:.045*dt*(.5+p.extraversion);
  if(hourly){let m=0;for(const k in a.rels){const r=a.rels[k];if(r.c>.4&&r.cf>m)m=r.cf;}a.maxCf=m;}
  const unemp=!a.job&&a.age>=18&&a.age<65&&!a.student&&!a.retired;
  const target=.12+.25*(1-p.estabilidad)+(a.age>=18?(a.money<0?.25:a.money<150000?.1:0):0)+(unemp?.15:0)+a.lateLog.length*.03+a.maxCf*.2+(n.hambre>.8?.1:0)+(n.energia<.15?.08:0);
  s.estres+=(clamp(target)-s.estres)*.05*dt;
  const mt=.55+.2*(n.energia-.5)-.4*(s.estres-.3)-.25*n.soledad-.2*Math.max(0,n.hambre-.5)+.12*(p.estabilidad-.5);
  s.animo+=(clamp(mt)-s.animo)*.08*dt;
  n.energia=clamp(n.energia);n.hambre=clamp(n.hambre);n.soledad=clamp(n.soledad);s.estres=clamp(s.estres);s.animo=clamp(s.animo);
}
function tick(){
  W.t+=TICK;const t=W.t;
  if(modOf(t)===0)daily();
  for(const a of W.agents){
    const tr=a.travel;
    if(tr&&t>=tr.depart+(tr.path.length-1)*MPT+tr.delay){a.loc=tr.dest;a.travel=null;a.act.active=true;onStart(a);}
    if(!a.travel&&t>=a.act.until){if(a.act.active)onEnd(a);decide(a);}
  }
  const occ=new Map();
  for(const a of W.agents)if(!a.travel&&a.act.active){let l=occ.get(a.loc);if(!l)occ.set(a.loc,l=[]);l.push(a);}
  const hourly=modOf(t)%60===0;
  for(const a of W.agents)updateNeeds(a,occ,hourly);
  const R=W.R;
  for(const[loc,list]of occ){
    if(list.length<2)continue;const pl=W.places[loc],f=FACTOR[pl.type]||.8;
    const aw=list.filter(x=>x.act.type!=='dormir');if(aw.length<2)continue;
    for(const a of aw){if(!R.chance(.018*(.4+a.pers.extraversion)*f))continue;const b=aw[R.int(0,aw.length-1)];if(b!==a)interact(a,b,pl);}
  }
}

  for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){
    if(isRoad(x,y)||isRoad(x+1,y)||isRoad(x,y+1)||isRoad(x-1,y)||isRoad(x,y-1))continue;
    const inBlock=COLS.some(c=>x>=c&&x<=c+9)&&ROWS.some(r=>y>=r&&y<=r+7);
    if(!inBlock&&R.chance(.22))tree(g,x*TS+R.int(0,2),y*TS+R.int(0,1));
  }
  for(const p of W.places)drawPlace(g,p,R);
}
function drawPlace(g,p,R){
  const x=p.rect.x*TS,y=p.rect.y*TS,w=p.rect.w*TS,h=p.rect.h*TS,dx=p.door.x*TS;
  g.fillStyle='#B6AE98';g.fillRect(dx+2,y+h,4,p.door.y*TS-(y+h));
  if(p.type==='parque'){
    g.fillStyle='#5F9146';g.fillRect(x,y,w,h);g.fillStyle='#4C7A38';g.fillRect(x,y,w,1);g.fillRect(x,y+h-1,w,1);g.fillRect(x,y,1,h);g.fillRect(x+w-1,y,1,h);
    g.fillStyle='#CDBF98';g.fillRect(x+2,y+Math.floor(h/2)-1,w-4,3);g.fillRect(x+Math.floor(w/2)-1,y+2,3,h-2);
    g.fillStyle='#3F7FB5';g.fillRect(x+6,y+6,14,8);g.fillRect(x+8,y+5,10,10);g.fillStyle='#6FA8D6';g.fillRect(x+9,y+7,4,1);
    for(let i=0;i<9;i++){const tx=x+R.int(4,w-9),ty=y+R.int(3,h-9);if(Math.abs(ty+3-(y+h/2))<5||Math.abs(tx+2-(x+w/2))<5||(tx<x+22&&ty<y+16))continue;tree(g,tx,ty);}
    g.fillStyle='#7A5A3A';g.fillRect(x+w-18,y+Math.floor(h/2)+4,6,2);g.fillRect(x+26,y+Math.floor(h/2)-5,6,2);
    return;
  }
  const S=STYLE[p.type],roof=Array.isArray(S.roof)?S.roof[p.cls===1?0:p.cls===2?1:2]:S.roof,rh=Math.round(h*.4);
  g.fillStyle='rgba(0,0,0,.2)';g.fillRect(x+2,y+2,w,h);
  g.fillStyle=S.wall;g.fillRect(x+1,y+rh,w-2,h-rh);
  g.fillStyle=roof;g.fillRect(x,y,w,rh);
  g.fillStyle='rgba(0,0,0,.18)';for(let yy=y+3;yy<y+rh-2;yy+=3)g.fillRect(x+1,yy,w-2,1);
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x,y+rh-2,w,2);
  p.windows=[];
  const wy0=y+rh+3,wstep=p.type==='oficina'?4:6;
  for(let wy=wy0;wy<y+h-8;wy+=wstep)for(let wx=x+4;wx<x+w-5;wx+=6){if(Math.abs(wx+1-(dx+4))<4&&wy>y+h-12)continue;g.fillStyle=S.win;g.fillRect(wx,wy,3,p.type==='oficina'?2:3);p.windows.push([wx,wy,3,p.type==='oficina'?2:3]);}
  g.fillStyle=S.door;g.fillRect(dx+2,y+h-6,4,6);
  if(S.awn){for(let i=0;i<w-2;i++){g.fillStyle=S.awn[Math.floor(i/2)%2];g.fillRect(x+1+i,y+rh,1,3);}}
  if(p.type==='hospital'){g.fillStyle='#C83A34';g.fillRect(x+w/2-1,y+3,3,9);g.fillRect(x+w/2-4,y+6,9,3);}
  if(p.type==='fabrica'){g.fillStyle='#5A5A60';g.fillRect(x+w-8,y-6,4,9);g.fillStyle='#B04A3A';g.fillRect(x+w-8,y-6,4,1);}
  if(p.type==='colegio'){g.fillStyle='#6A5020';g.fillRect(x+3,y-6,1,8);g.fillStyle='#F2D24A';g.fillRect(x+4,y-6,4,2);g.fillStyle='#2A5FA8';g.fillRect(x+4,y-4,4,1);g.fillStyle='#C83A34';g.fillRect(x+4,y-3,4,1);}
  if(p.type==='gimnasio'){g.fillStyle='#EDEAF7';g.fillRect(x+w/2-5,y+5,11,1);g.fillRect(x+w/2-6,y+3,2,5);g.fillRect(x+w/2+5,y+3,2,5);}
}

function agentXY(a,rt){
  if(a.travel){
    const tr=a.travel,P=tr.path,k=(rt-tr.depart)/MPT,i=clamp(Math.floor(k),0,P.length-1),f=clamp(k-i),p0=P[i],p1=P[Math.min(i+1,P.length-1)];
    return{x:(p0[0]+(p1[0]-p0[0])*f)*TS+1+(a.idx%3)*2,y:(p0[1]+(p1[1]-p0[1])*f)*TS+2+((a.idx>>2)%3)*2,walk:true,frame:Math.floor(k*2)%2};
  }
  const pl=W.places[a.loc];
  if(pl&&pl.type==='parque'&&a.act.active){const s=pl.spots[a.idx%pl.spots.length];return{x:s[0],y:s[1],walk:false,frame:0};}
  return null;
}
function drawAgent(a,pos){
  const x=Math.round(pos.x),y=Math.round(pos.y)-4,L=a.look,small=a.age<12;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x-1,y+(small?4:5),5,1);
  ctx.fillStyle=L.hair;ctx.fillRect(x,y,3,1);
  ctx.fillStyle=L.skin;ctx.fillRect(x,y+1,3,1);
  ctx.fillStyle=L.shirt;ctx.fillRect(x,y+2,3,small?1:2);
  ctx.fillStyle=L.pants;const ly=y+(small?3:4);
  if(pos.walk&&pos.frame){ctx.fillRect(x,ly,1,1);ctx.fillRect(x+2,ly,1,1);}else{ctx.fillRect(x+1,ly,1,1);ctx.fillRect(x,ly,1,1);}
}
function dark(mod){if(mod<300||mod>=1230)return .5;if(mod<420)return .5*(1-(mod-300)/120);if(mod>=1080)return .5*(mod-1080)/150;return 0;}

function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1,w=Math.round(r.width*d),h=Math.round(r.height*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}return{r,d};}
function camera(){
  const{r,d}=resize();const fit=Math.min(r.width/(TW*TS),r.height/(TH*TS));
  const raw=fit*UI.cam.z*d,s=(raw>=3?Math.floor(raw):raw)/d;UI.scale=s;
  const c=UI.cam,vw=r.width/s,vh=r.height/s;
  if(UI.follow&&UI.sel){const a=AG(UI.sel),p=agentXY(a,W.t+UI.acc)||(()=>{const pl=W.places[a.loc??a.act.placeId];return{x:(pl.rect.x+pl.rect.w/2)*TS,y:(pl.rect.y+pl.rect.h/2)*TS};})();c.x=p.x;c.y=p.y;}
  c.x=vw>=TW*TS?TW*TS/2:clamp(c.x,vw/2,TW*TS-vw/2);c.y=vh>=TH*TS?TH*TS/2:clamp(c.y,vh/2,TH*TS-vh/2);
  return{r,d,s};
}
function draw(now){
  const{r,d,s}=camera(),c=UI.cam;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#5B8440';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(d*s,0,0,d*s,d*(r.width/2-c.x*s),d*(r.height/2-c.y*s));ctx.imageSmoothingEnabled=false;
  ctx.drawImage(base,0,0);
  const rt=W.t+Math.min(UI.acc,TICK);
  for(const a of W.agents){const p=agentXY(a,rt);if(p)drawAgent(a,p);}
  const dk=dark(modOf(W.t));
  if(dk>0){
    ctx.fillStyle=`rgba(16,20,56,${dk})`;ctx.fillRect(0,0,TW*TS,TH*TS);
    if(dk>.15){
      const occ={};for(const a of W.agents)if(!a.travel&&a.act.active&&a.act.type!=='dormir')occ[a.loc]=(occ[a.loc]||0)+1;
      ctx.fillStyle='#FFD66B';
      for(const p of W.places){if(!p.windows)continue;const lit=p.type==='casa'?occ[p.id]:openAt(p,modOf(W.t),dowOf(W.t));if(!lit)continue;
        p.windows.forEach((w,i)=>{if(p.type==='casa'&&(i+p.id)%3===2&&occ[p.id]<3)return;ctx.fillRect(w[0],w[1],w[2],w[3]);});}
    }
  }
  const blink=reduced?1:(Math.floor(now/400)%2);
  if(UI.selPlace!=null){const p=W.places[UI.selPlace];ctx.strokeStyle='#FFE46B';ctx.lineWidth=1/s*Math.max(1,Math.round(s));ctx.strokeRect(p.rect.x*TS-1.5,p.rect.y*TS-1.5,p.rect.w*TS+3,p.rect.h*TS+3);}
  if(UI.sel){
    const a=AG(UI.sel),p=agentXY(a,rt);
    if(p){ctx.fillStyle='#FFE46B';const x=Math.round(p.x),y=Math.round(p.y)-8-(blink?1:0);ctx.fillRect(x,y,3,1);ctx.fillRect(x+1,y+1,1,1);}
    else{const pl=W.places[a.loc];if(pl&&blink){ctx.strokeStyle='#FFE46B';ctx.lineWidth=1/s*Math.max(1,Math.round(s));ctx.strokeRect(pl.rect.x*TS-1.5,pl.rect.y*TS-1.5,pl.rect.w*TS+3,pl.rect.h*TS+3);}}
  }
}

// ---------- textos ----------
const VERB={dormir:'durmiendo',desayunar:'desayunando',comer:'comiendo',trabajar:'trabajando',estudiar:'estudiando',socializar:'pasando el rato',descansar:'descansando',comprar:'de compras',ejercicio:'entrenando',jugar:'jugando'};
function doing(a){
  const pl=W.places[a.act.placeId],home=a.act.placeId===a.homeId,where=home?'en casa':pl.type==='casa'?'en '+pl.name:'en '+pl.name;
  if(a.travel)return `camino a ${home?'casa':pl.name}`;
  if(a.act.type==='enfermo')return `enferm${g(a,'o','a')}, en casa`;
  return `${VERB[a.act.type]||a.act.type} ${where}`;
}
function ago(t){const m=W.t-t;if(m<60)return `hace ${m} min`;if(m<1440)return `hace ${Math.round(m/60)} h`;const d=Math.round(m/1440);if(d<60)return `hace ${d} ${d===1?'día':'días'}`;return `hace ${Math.round(d/30)} meses`;}
const moodColor=v=>v>.62?'#2E9A62':v>.45?'#C7A23A':v>.3?'#D97A34':'#C0433C';
const REL_LBL={amigo:['amigo','amiga'],conocido:['conocido','conocida'],'compañero':['compañero','compañera'],'compañero de clase':['compañero de clase','compañera de clase'],vecino:['vecino','vecina'],desconocido:['desconocido','desconocida'],pareja:['pareja','pareja'],'ex pareja':['ex pareja','ex pareja']};
const relLbl=(r,other)=>REL_LBL[r.type]?REL_LBL[r.type][other.sex==='F'?1:0]:r.type;
const EVK={JOB_STARTED:['Empleo nuevo','good','trabajo'],JOB_LOST:['Despido','bad','trabajo'],LLEGADA_TARDE:['Llegada tarde','warn','trabajo'],
  ARGUMENT_OCCURRED:['Discusión','bad','relaciones'],AMISTAD:['Amistad','good','relaciones'],RELATIONSHIP_STARTED:['Nueva pareja','good','relaciones'],
  RELATIONSHIP_ENDED:['Ruptura','bad','relaciones'],REGALO:['Regalo','good','relaciones'],CUMPLEAÑOS:['Cumpleaños','info','relaciones'],
  OBJECT_PURCHASED:['Compra','info','economia'],OBJECT_LOST:['Pérdida','warn','economia'],DEUDA:['Números rojos','bad','economia'],
  SALUD:['Salud','warn','salud'],RUMOR:['Rumor','info','info']};
function evText(e){return esc(e.text).replace(/\{(\d)\}/g,(_,i)=>{const a=AG(e.actors[+i]);return `<button class="who" data-id="${a.id}">${esc(a.name)}</button>`;});}
function evRow(e,withKind=true){
  const k=EVK[e.type]||[e.type,'info'];

function renderLog(){
  const list=[];for(let i=W.events.length-1;i>=0&&list.length<150;i--){const e=W.events[i];if(e.minor&&!UI.minor)continue;if(UI.filter!=='all'&&(EVK[e.type]||[])[2]!==UI.filter)continue;list.push(e);}
  $('#events').innerHTML=list.length?list.map(e=>evRow(e)).join(''):`<li class="empty" style="display:block">Aún no hay eventos de este tipo. Sube la velocidad o avanza un día para que el mundo produzca historia.</li>`;
  W.logDirty=false;
}
function bar(label,v,hot){return `<div class="bar"><span>${label}</span><div class="track"><i class="${hot&&v>.6?'hot':''}" style="width:${Math.round(v*100)}%"></i></div><b>${Math.round(v*100)}</b></div>`;}
function mini(label,v,hot){return `<div class="mini"><span>${label}</span><div class="track"><i class="${hot?'hot':''}" style="width:${Math.round(v*100)}%"></i></div><span>${Math.round(v*100)}</span></div>`;}
const nameBtn=id=>{const a=AG(id);return a?`<button class="who" data-id="${a.id}">${esc(a.name)}</button>`:'alguien';};

function renderInspector(full){

const TAB={

  relaciones(a){

      ${mini(`Cercanía de ${a.first}`,r.c)}${mini(`Cercanía de ${b.first}`,rb?rb.c:0)}${mini('Confianza',r.tr)}${mini('Conflicto',r.cf,1)}<small>${r.n} encuentros${r.args?`, ${r.args} discusiones`:''}${r.last?`, último ${ago(r.last)}`:''}</small></li>`).join('')}</ul>`;
  },
  memoria(a){
    const ms=a.mems.map(m=>({m,s:mStrength(m)})).sort((x,y)=>y.m.t-x.m.t);
    if(!ms.length)return '<p class="empty">Aún no ha formado recuerdos. Aparecen cuando le pasan cosas.</p>';
    return `<p class="sub" style="margin-top:12px">Lo que recuerda, no lo que pasó. La fuerza baja con el tiempo y sube cuando vuelve a ver a la persona implicada.</p><ul class="list">${ms.map(({m,s})=>`<li class="${s<.08?'faded':''}">${esc(m.text)}<small>${ago(m.t)}${s<.08?', casi olvidado':''}${m.d?'. Lo recuerda como más grave de lo que fue.':''}</small>${mini('Fuerza',clamp(s),m.v<0)}</li>`).join('')}</ul>`;
  },
  historia(a){

    const friends=Object.values(a.rels).filter(r=>r.type==='amigo').length,partner=partnerOf(a);
    const report=`<h3>Informe de vida (${days} ${days===1?'día':'días'} simulados)</h3><div class="report">
      <div><span>Dinero</span><b>${money(i.money)} → ${money(a.money)}</b></div><div><span>Ánimo</span><b>${pct(i.animo)} → ${pct(a.st.animo)}</b></div>
      <div><span>Estrés</span><b>${pct(i.estres)} → ${pct(a.st.estres)}</b></div><div><span>Trabajo</span><b>${(i.job||'ninguno')===(a.job?W.places[a.job.org].name:'ninguno')?'Sin cambios: '+esc(i.job||'ninguno'):esc(i.job||'ninguno')+' → '+esc(a.job?W.places[a.job.org].name:'ninguno')}</b></div>
      <div><span>Amistades</span><b>${i.friends} → ${friends}</b></div><div><span>Pareja</span><b>${i.partner?'sí':'no'} → ${partner?esc(partner.name):'no'}</b></div>
      <div><span>Discusiones</span><b>${cnt('ARGUMENT_OCCURRED')}</b></div><div><span>Llegadas tarde</span><b>${cnt('LLEGADA_TARDE')}</b></div></div>
      <p class="sub">La historia no se borra cuando cambia el estado. Cada hecho guarda sus causas.</p>`;
    const list=H.slice().reverse().map(e=>evRow(e,true)).join('');
    return report+`<h3>Trayectoria</h3><ul class="list" style="list-style:none">${list?list.replace(/<li>/g,'<li style="display:block">'):'<li class="empty">Todavía no le ha pasado nada registrable.</li>'}</ul>`;
  },
  conocimiento(a){
    const others=[...a.beliefs].filter(([fid])=>W.facts[fid].subject!==a.id);
    const about=W.facts.filter(f=>f.subject===a.id);
    const o1=others.length?`<ul class="list">${others.map(([fid,b])=>{const f=W.facts[fid];return `<li>«${esc(b.text)}»<small>${b.correct?'<span class="ok">Coincide con la realidad.</span>':`<span class="no">No coincide.</span> Realidad: ${esc(f.truth)}.`} ${b.from?`Se lo contó ${esc(AG(b.from).name)}`:'Lo sabe de primera mano'}, ${ago(b.t)}.</small></li>`;}).join('')}</ul>`:'<p class="empty">No ha oído noticias sobre otras personas. La información viaja cuando la gente conversa.</p>';
    const o2=about.length?about.map(f=>{
      const holders=W.agents.filter(x=>x!==a&&x.beliefs.has(f.id));const groups={};holders.forEach(x=>{const t=x.beliefs.get(f.id).text;(groups[t]=groups[t]||[]).push(x);});
      return `<div class="now" style="margin-top:8px"><b>Verdad del mundo:</b> ${esc(f.truth)}<br><b>Lo que cuenta ${esc(a.first)}:</b> «${esc(a.selfStory[f.id])}»${a.selfStory[f.id]!==f.truth?' <span class="no">(no es cierto)</span>':''}</div>
        <ul class="list">${Object.entries(groups).map(([t,xs])=>`<li>«${esc(t)}» <span class="${t===f.truth?'ok':'no'}">${t===f.truth?'cierto':'falso'}</span><small>Lo creen: ${xs.map(x=>esc(x.name)).join(', ')}</small></li>`).join('')||'<li class="empty">Nadie más lo sabe todavía.</li>'}</ul>`;}).join(''):'<p class="empty">No circula información sobre esta persona.</p>';
    return `<h3>Lo que cree sobre otras personas</h3>${o1}<h3>Lo que se sabe de ${esc(a.first)}</h3>${o2}`;
  }
};
function updateHeader(){
  $('#clkTime').textContent=fmtClock(W.t);$('#clkDate').textContent=fmtDate(W.t);$('#clkDay').textContent=`Día ${dayOf(W.t-360)+1} de simulación`;
  const wa=W.agents.filter(a=>a.age>=18&&a.age<65&&!a.student&&!a.retired);
  $('#stPop').textContent=W.agents.length;$('#stJob').textContent=pct(wa.filter(a=>a.job).length/Math.max(1,wa.length));
  $('#stMood').textContent=Math.round(W.agents.reduce((s,a)=>s+a.st.animo,0)/W.agents.length*100);$('#stEv').textContent=W.todayEvents;
}

// ---------- ciclo principal ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(UI.running&&!W.bulk){UI.acc+=dt*UI.speed;let n=0;while(UI.acc>=TICK&&n<600){tick();UI.acc-=TICK;n++;}if(n>=600)UI.acc=0;}
  draw(now);
  if(!W.bulk&&now-UI.lastUI>300){UI.lastUI=now;updateHeader();renderInspector(false);}
  if(!W.bulk&&W.logDirty&&now-UI.lastLog>500){UI.lastLog=now;renderLog();}
  requestAnimationFrame(frame);
}
function runFor(min){
  if(W.bulk)return;W.bulk=true;const end=W.t+min;$('#progress').classList.add('on');
  const step=()=>{const t0=performance.now();while(W.t<end&&performance.now()-t0<28)tick();const f=1-(end-W.t)/min;$('#progPct').textContent=pct(f);$('#progBar').style.width=pct(f);
    if(W.t<end)setTimeout(step,0);else{W.bulk=false;UI.acc=0;$('#progress').classList.remove('on');updateHeader();renderInspector(true);renderLog();}};
  step();
}
function start(seed){genWorld(seed);renderBase();UI.sel=null;UI.selPlace=null;UI.acc=0;updateHeader();renderInspector(true);renderLog();}

// ---------- eventos de interfaz ----------
function select(id){UI.sel=id;UI.selPlace=null;UI.tab=UI.tab||'estado';renderInspector(true);}
document.addEventListener('click',e=>{
  const w=e.target.closest('[data-id]');if(w){select(w.dataset.id);return;}
  const tb=e.target.closest('[data-tab]');if(tb){UI.tab=tb.dataset.tab;renderInspector(true);return;}
  if(e.target.closest('[data-back]')){UI.sel=null;UI.selPlace=null;UI.follow=false;$('#follow').setAttribute('aria-pressed','false');renderInspector(true);}
});
$('#play').onclick=()=>{UI.running=!UI.running;$('#play').textContent=UI.running?'Pausar':'Reanudar';$('#play').setAttribute('aria-label',UI.running?'Pausar la simulación':'Reanudar la simulación');};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{UI.speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>runFor(+b.dataset.adv));
$('#seedForm').onsubmit=e=>{e.preventDefault();start((+$('#seed').value|0)>>>0);};
$('#chips').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;UI.filter=b.dataset.f;document.querySelectorAll('#chips [data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderLog();};
$('#showMinor').onchange=e=>{UI.minor=e.target.checked;renderLog();};
$('#zoomIn').onclick=()=>{UI.cam.z=Math.min(6,UI.cam.z*1.5);};
$('#zoomOut').onclick=()=>{UI.cam.z=Math.max(1,UI.cam.z/1.5);};
$('#center').onclick=()=>{UI.cam={x:TW*TS/2,y:TH*TS/2,z:1};UI.follow=false;$('#follow').setAttribute('aria-pressed','false');};
$('#follow').onclick=()=>{if(!UI.sel)return;UI.follow=!UI.follow;$('#follow').setAttribute('aria-pressed',UI.follow);if(UI.follow&&UI.cam.z<2.5)UI.cam.z=3;};

function toWorld(ev){const r=cv.getBoundingClientRect(),s=UI.scale;return{x:(ev.clientX-r.left-(r.width/2-UI.cam.x*s))/s,y:(ev.clientY-r.top-(r.height/2-UI.cam.y*s))/s};}
function hit(ev){
  const p=toWorld(ev),rt=W.t+Math.min(UI.acc,TICK);let best=null,bd=7;
  for(const a of W.agents){const q=agentXY(a,rt);if(!q)continue;const d=Math.hypot(q.x+1-p.x,q.y-2-p.y);if(d<bd){bd=d;best=a;}}
  if(best)return{agent:best};
  const tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS);
  const pl=W.places.find(q=>tx>=q.rect.x&&tx<q.rect.x+q.rect.w&&ty>=q.rect.y&&ty<q.rect.y+q.rect.h);return pl?{place:pl}:null;
}
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:UI.cam.x,cy:UI.cam.y,moved:false};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;cv.classList.add('dragging');UI.follow=false;$('#follow').setAttribute('aria-pressed','false');}
    if(drag.moved){UI.cam.x=drag.cx-dx/UI.scale;UI.cam.y=drag.cy-dy/UI.scale;}return;}
  const h=hit(e),tip=$('#tip');
  if(!h){tip.style.display='none';return;}
  const r=$('#mapwrap').getBoundingClientRect();
  if(h.agent)tip.innerHTML=`<b>${esc(h.agent.name)}</b>${esc(doing(h.agent))}`;
  else{const n=W.agents.filter(a=>!a.travel&&a.loc===h.place.id).length;tip.innerHTML=`<b>${esc(h.place.name)}</b>${h.place.label}, ${n} ${n===1?'persona':'personas'} dentro`;}
  tip.style.display='block';tip.style.left=Math.min(e.clientX-r.left+12,r.width-250)+'px';tip.style.top=(e.clientY-r.top+12)+'px';
});
cv.addEventListener('pointerup',e=>{
  const wasDrag=drag&&drag.moved;drag=null;cv.classList.remove('dragging');if(wasDrag)return;
  const h=hit(e);if(!h)return;
  if(h.agent)select(h.agent.id);else{UI.sel=null;UI.selPlace=h.place.id;renderInspector(true);}
});
cv.addEventListener('pointerleave',()=>{$('#tip').style.display='none';});
cv.addEventListener('wheel',e=>{e.preventDefault();UI.cam.z=clamp(UI.cam.z*(e.deltaY<0?1.2:1/1.2),1,6);},{passive:false});

start(108);requestAnimationFrame(frame);
}
</script>
</body>
